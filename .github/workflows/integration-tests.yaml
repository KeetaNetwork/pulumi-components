name: Integration Tests

on:
  # Temp - Remove once verified working
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20.18.0
          registry-url: "https://npm.pkg.github.com"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1

      - name: Login to Pulumi State Backend
        run: pulumi login gs://pulumi-liftoffs-truest-561598453/

      - name: Build
        run: make dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Integration Tests
        run: make test
        env:
          GOOGLE_PROJECT: ${{ vars.GOOGLE_PROJECT }}
          TEST_DOMAIN: ${{ vars.TEST_DOMAIN }}
          TEST_DNS_ZONE_ID: ${{ vars.TEST_DNS_ZONE_ID }}
